name: geo-check
on:
  push:
    branches: [main]
    paths: [.github/workflows/geo_check.yml]
  workflow_dispatch:
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - name: follower_demographics country
        env:
          TOKEN: ${{ secrets.LONG_LIVED_TOKEN }}
          UID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/${UID}/insights?metric=follower_demographics&period=lifetime&metric_type=total_value&breakdown=country&access_token=${TOKEN}" | python3 -m json.tool
      - name: reached_audience_demographics country
        env:
          TOKEN: ${{ secrets.LONG_LIVED_TOKEN }}
          UID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/${UID}/insights?metric=reached_audience_demographics&period=lifetime&metric_type=total_value&breakdown=country&access_token=${TOKEN}" | python3 -m json.tool
