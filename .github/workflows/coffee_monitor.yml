name: Coffee Comment Monitor

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run Coffee Monitor
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          LONG_LIVED_TOKEN:  ${{ secrets.LONG_LIVED_TOKEN }}
        run: python instagram/coffee_monitor.py

      - name: Save replied state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/coffee_replied.json || true
          git diff --cached --quiet || git commit -m "chore: update coffee_replied.json"
          git push origin main || true
