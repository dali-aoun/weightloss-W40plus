name: GET_IG_REELS_TMP
on:
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch recent reels
        env:
          TOKEN: ${{ secrets.LONG_LIVED_TOKEN }}
          USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python3 -c "
import urllib.request, json, os
token = os.environ['TOKEN']
uid = os.environ['USER_ID']
url = f'https://graph.instagram.com/v21.0/{uid}/media?fields=id,media_type,permalink,timestamp&limit=5&access_token={token}'
with urllib.request.urlopen(url) as r:
    data = json.loads(r.read())
for m in data.get('data', []):
    if m.get('media_type') == 'VIDEO':
        print(m['permalink'], m['timestamp'])
"
