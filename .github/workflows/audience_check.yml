name: audience-demographics-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch demographics
        env:
          TOKEN: ${{ secrets.LONG_LIVED_TOKEN }}
          UID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          pip install requests -q
          python3 << 'EOF'
import requests, json, os
TOKEN = os.environ['TOKEN']
USER_ID = os.environ['UID']
BASE = 'https://graph.facebook.com/v21.0'
for metric in ['follower_demographics', 'reached_audience_demographics']:
    for breakdown in ['country', 'city']:
        r = requests.get(f'{BASE}/{USER_ID}/insights', params={
            'metric': metric,
            'period': 'lifetime',
            'metric_type': 'total_value',
            'breakdown': breakdown,
            'access_token': TOKEN
        })
        print(f'=== {metric} by {breakdown} ===')
        data = r.json()
        if 'data' in data:
            values = data['data'][0].get('total_value', {}).get('breakdowns', [{}])[0].get('results', [])
            values.sort(key=lambda x: x.get('value',0), reverse=True)
            for v in values[:15]:
                print(f"  {v.get('dimension_values',['?'])[0]}: {v.get('value',0)}")
        else:
            print(json.dumps(data)[:500])
EOF
